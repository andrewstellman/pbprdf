[project]
name = "pbprdf"
version = "2.0.0"
description = "Generate RDF triples from ESPN basketball play-by-play data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx",
  "pydantic>=2.0",
  "rdflib>=7.0",
  "sparqlwrapper>=2.0",
  "typer>=0.12",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
